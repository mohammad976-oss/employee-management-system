# --- Server ---
server.port=8099

# --- MySQL Connection ---
# Update these to match your local MySQL setup.
# Create the database first: CREATE DATABASE ems_db;
spring.datasource.url=jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' will auto-create/alter tables from the entity classes on startup.
# Switch to 'validate' or 'none' once you manage schema manually via database/schema.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Jackson ---
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Logging ---
logging.level.com.ems=INFO
